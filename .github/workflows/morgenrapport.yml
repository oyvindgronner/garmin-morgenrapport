name: Morgenrapport

on:
  workflow_dispatch:
    inputs:
      okt_kommentar:
        description: 'Subjektiv opplevelse av siste økt'
        required: false
        default: ''

jobs:
  morgenrapport:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Hent data
        env:
          STRAVA_CLIENT_ID:     ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          TP_AUTH_COOKIE:       ${{ secrets.TP_AUTH_COOKIE }}
        run: python morgen.py

      - name: Commit og push JSON
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f garmin_data_*.json
          git diff --staged --quiet || git commit -m "Data oppdatert $(date +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

      - name: Generer Claude-analyse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OKT_KOMMENTAR:     ${{ github.event.inputs.okt_kommentar }}
        run: python claude_analyse.py

      - name: Generer dashboard
        env:
          DASHBOARD_PASSWORD:     ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_GITHUB_TOKEN: ${{ secrets.DASHBOARD_GITHUB_TOKEN }}
        run: python generer_dashboard.py

      - name: Commit og push dashboard
        run: |
          git add docs/index.html okt_logg.json
          git diff --staged --quiet || git commit -m "Dashboard oppdatert $(date +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
