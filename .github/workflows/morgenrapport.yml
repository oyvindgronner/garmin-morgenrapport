name: Garmin morgenrapport

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  morgenrapport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install garminconnect garth requests google-auth google-auth-httplib2 google-api-python-client

      - run: python garmin_morgen.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

      - run: python tp_morgen.py
        env:
          TP_AUTH_COOKIE: ${{ secrets.TP_AUTH_COOKIE }}

      - run: python strava_hent.py
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}

      - run: python gdrive_upload.py
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}

      - run: python signal_send.py
        env:
          SIGNAL_ID: ${{ secrets.SIGNAL_ID }}
          SIGNAL_API_KEY: ${{ secrets.SIGNAL_API_KEY }}

      - run: python send_epost.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: garmin-${{ github.run_id }}
          path: garmin_data_*.json
          retention-days: 7
